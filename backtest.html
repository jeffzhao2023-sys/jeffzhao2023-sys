<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回测报告 · 换手龙断板低吸</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", -apple-system, sans-serif; background: #f4f6f9; color: #1f2937; padding: 20px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 16px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
  th { background: #f8fafc; color: #374151; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .mono { font-variant-numeric: tabular-nums; }
  .up { color: #ef4444; font-weight: 600; }
  .down { color: #16a34a; font-weight: 600; }
  .count { color: #6b7280; font-weight: normal; margin-left: 8px; }
  .empty-tip { color: #6b7280; font-style: italic; }
  .warn { background: #fef3c7; border-left: 4px solid #d97706; padding: 12px 14px;
          border-radius: 8px; font-size: 13px; line-height: 1.7; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 900px) { .stats { grid-template-columns: 1fr 1fr; } }
  .stat { background: #f8fafc; border-radius: 8px; padding: 12px; }
  .stat .k { color: #6b7280; font-size: 12px; margin-bottom: 4px; }
  .stat .v { font-size: 20px; font-weight: 600; }
</style>
</head>
<body>
  <h1>📊 回测报告 · 换手龙断板低吸</h1>
  <div class="sub" id="head">加载中…</div>
  <div class="sub" style="margin-top:-8px"><a href="dashboard.html" style="color:#2563eb">← 返回主看板</a></div>

  <div class="warn">
    <b>请先读这段：</b><br>
    · 这是<b>历史回测，不是未来收益保证</b>。样本仅 20 个交易日，笔数很少，<b>不足以证明策略有效或无效</b>。<br>
    · 成交假设为「按抽样分钟内成交」，未考虑涨跌停无法成交、流动性不足等真实限制，结果<b>偏乐观</b>。<br>
    · 按本次设定的口径，<b>未加 T+1 限制</b>；已计入佣金、印花税、滑点。<br>
    · 盘中止损/止盈按分钟数据还原，与实盘每 30 秒轮询的触发时点可能有细微差异。
  </div>

  <div class="card">
    <h2>汇总 <span class="count" id="sumTip"></span></h2>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <h2>已了结交易 <span class="count" id="closedCount"></span></h2>
    <div id="closedBody"></div>
  </div>

  <div class="card">
    <h2>未了结 <span class="count" id="openCount"></span></h2>
    <div id="openBody"></div>
  </div>

  <div class="card">
    <h2>规则快照</h2>
    <div id="rules" style="font-size:13px;line-height:1.9;color:#374151"></div>
  </div>

<script src="backtest_data.js" charset="utf-8"></script>
<script>
  var B = window.BACKTEST_DATA || null;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtDate(v){ if(!v||v.length!==8) return '—'; return v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8); }
  function pct(v){ if(v==null) return '—'; return (v>0?'+':'')+Number(v).toFixed(2)+'%'; }
  function pctCls(v){ if(v==null||v===0) return ''; return v>0?'up':'down'; }

  function init(){
    if(!B){ document.getElementById('head').textContent='未找到数据：请先运行 py -3 backtest_20d.py 生成 backtest_data.js'; return; }
    var bt = B.backtest || {};
    document.getElementById('head').innerHTML =
      '数据生成：'+esc(B.generated)+'　·　回测窗口：'+fmtDate(bt.entryDays&&bt.entryDays[0])
      +' ~ '+fmtDate(bt.entryDays&&bt.entryDays[bt.entryDays.length-1])
      +'（'+((bt.entryDays||[]).length)+' 个交易日）　·　跟踪至 '+fmtDate(B.today);

    var s = (bt.summary||{}), g = s.gross||{}, n = s.net||{};
    // 前端按记录重算一遍，确保与下方表格口径一致
    function agg(rows){ return rows.map(function(x){return x.netPnl;}).filter(function(v){return v!=null;}); }
    var _recsAll = (B.records||[]);
    var _closedAll = _recsAll.filter(function(r){ return r.sellPrice!=null && r.buyPrice!=null; });
    var _vals = _closedAll.map(function(r){
        return (r.netPnl!=null) ? r.netPnl : ((r.sellPrice/r.buyPrice-1)*100); });
    if(_vals.length){
      var _win = _vals.filter(function(v){return v>0;}).length;
      n = { n:_vals.length, win:_win, winRate: Math.round(_win/_vals.length*1000)/10,
            avg: Math.round(_vals.reduce(function(a,b){return a+b;},0)/_vals.length*100)/100,
            sum: Math.round(_vals.reduce(function(a,b){return a+b;},0)*100)/100,
            max: Math.round(Math.max.apply(null,_vals)*100)/100,
            min: Math.round(Math.min.apply(null,_vals)*100)/100 };
    }
    document.getElementById('sumTip').textContent = '毛收益 / 含成本净收益';
    function stat(k, v, cls){ return '<div class="stat"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+'</div></div>'; }
    document.getElementById('stats').innerHTML =
      stat('已了结笔数', (n.n||0)+' 笔')
      + stat('胜率', (n.winRate==null?'—':n.winRate+'%'))
      + stat('平均净收益', pct(n.avg), pctCls(n.avg))
      + stat('合计净收益', pct(n.sum), pctCls(n.sum))
      + stat('单笔最大盈利', pct(n.max), 'up')
      + stat('单笔最大亏损', pct(n.min), 'down')
      + stat('毛收益合计', pct(g.sum), pctCls(g.sum))
      + stat('候选股票-日', ((bt.candTotal||0))+' 个');

    // 已了结 = 有卖出价（「待返场」也是已离场，不能按状态名判断）
    var recs = (B.records||[]);
    var closed = recs.filter(function(r){ return r.sellPrice!=null && r.buyPrice!=null; });
    var open = recs.filter(function(r){ return !(r.sellPrice!=null && r.buyPrice!=null) && r.buyPrice!=null; });

    document.getElementById('closedCount').textContent = '('+closed.length+')';
    var h = '<table><tr><th>代码</th><th>名称</th><th>高度</th><th>买入日</th><th>买入价</th>'
          + '<th>卖出日</th><th>卖出价</th><th>毛收益</th><th>净收益</th><th>原因</th></tr>';
    if(closed.length===0){ h += '<tr><td colspan="10" class="empty-tip">无已了结交易</td></tr>'; }
    closed.sort(function(a,b){ return (a.buyDate||'')<(b.buyDate||'')?1:-1; });
    closed.forEach(function(r){
      h += '<tr><td class="mono">'+esc(r.code)+'</td><td>'+esc(r.name)+'</td>'
        + '<td>'+esc(r.boards)+'板</td>'
        + '<td class="mono">'+fmtDate(r.buyDate)+'</td><td class="mono">'+esc(r.buyPrice)+'</td>'
        + '<td class="mono">'+fmtDate(r.sellDate)+'</td><td class="mono">'+esc(r.sellPrice)+'</td>'
        + '<td class="mono '+pctCls(r.pnl)+'">'+pct(r.pnl)+'</td>'
        + '<td class="mono '+pctCls(r.netPnl)+'">'+pct(r.netPnl)+'</td>'
        + '<td>'+esc(r.sellReason||'')+'</td></tr>';
    });
    document.getElementById('closedBody').innerHTML = h+'</table>';

    document.getElementById('openCount').textContent = '('+open.length+')';
    var h2 = '<table><tr><th>代码</th><th>名称</th><th>高度</th><th>状态</th><th>买入日</th>'
           + '<th>买入价</th><th>现价</th><th>浮动</th></tr>';
    if(open.length===0){ h2 += '<tr><td colspan="8" class="empty-tip">无</td></tr>'; }
    open.sort(function(a,b){ return (a.buyDate||'')<(b.buyDate||'')?1:-1; });
    open.forEach(function(r){
      var fl = (r.buyPrice&&r.price)?(r.price/r.buyPrice-1)*100:null;
      h2 += '<tr><td class="mono">'+esc(r.code)+'</td><td>'+esc(r.name)+'</td>'
         + '<td>'+esc(r.boards)+'板</td><td>'+esc(r.status)+'</td>'
         + '<td class="mono">'+fmtDate(r.buyDate)+'</td><td class="mono">'+esc(r.buyPrice||'—')+'</td>'
         + '<td class="mono">'+esc(r.price==null?'—':r.price)+'</td>'
         + '<td class="mono '+pctCls(fl)+'">'+pct(fl)+'</td></tr>';
    });
    document.getElementById('openBody').innerHTML = h2+'</table>';

    var c = bt.cost || {};
    document.getElementById('rules').innerHTML =
      '· 选股：上一交易日连板池中「连板 ≥ 3 板 + 连板期内非全一字 + 前期涨幅 ≥ 35%」<br>'
      + '· 买入：断板日 14:50，当日不再涨停且涨幅 ≥ 0% → 买入（买价＝当时价）<br>'
      + '· 卖出①：断板日之后任一交易日 14:50 现价 < 断板日开盘价 → 离场<br>'
      + '· 卖出②：现价跌破 5 日线（含当天）→ 止损<br>'
      + '· 卖出③：曾浮盈 > 10% 后回撤 ≥ 5 个百分点 → 止盈（含成本后可能仍为亏损）<br>'
      + '· 返场：止损/离场后 5 个交易日内、14:55 现价 > 5 日线且未跌破断板日开盘价 → 再买入<br>'
      + '· 成本：佣金 '+esc(c.commission)+'（双边）　印花税 '+esc(c.stamp)+'（卖出）　滑点 '+esc(c.slippage)+'（单边）';
  }
  try { init(); } catch(e){ document.getElementById('head').textContent='渲染失败：'+e;
    if(window.console) console.error(e); }
</script>
</body>
</html>
