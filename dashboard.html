<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投资看板 · 换手龙断板低吸 & 首次唯一最高板 & 连板股低吸</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", -apple-system, sans-serif; background: #f4f6f9; color: #1f2937; padding: 20px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: normal; }
  .b-today { background: #2563eb; color: #fff; }
  .b-recession { background: #ef4444; color: #fff; }
  .b-ok { background: #16a34a; color: #fff; }
  .b-empty { background: #9ca3af; color: #fff; }
  .b-highest { background: #7c3aed; color: #fff; }
  .b-none { background: #e5e7eb; color: #374151; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
  th { background: #f8fafc; color: #374151; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .emotion-recession { color: #ef4444; font-weight: 600; }
  .emotion-normal { color: #16a34a; }
  .emotion-up { color: #ef4444; font-weight: 600; }
  .emotion-down { color: #16a34a; font-weight: 600; }
  .emotion-chaos { color: #d97706; }
  details { margin-bottom: 8px; }
  summary { cursor: pointer; font-size: 14px; font-weight: 600; padding: 8px 10px; background: #f8fafc; border-radius: 8px; }
  summary:hover { background: #eef2f7; }
  .count { color: #6b7280; font-weight: normal; margin-left: 8px; }
  .empty-tip { color: #6b7280; font-style: italic; }
  .lb-section { background: #eef2f7; font-weight: 600; color: #374151; border-top: 2px solid #9ca3af; }
  .lb-broken { color: #16a34a; font-weight: 600; }
  .lb-healthy { color: #ef4444; font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .grid2c { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1200px) { .grid2c { grid-template-columns: 1fr; } }
  .col h1 { font-size: 18px; margin-bottom: 4px; }
  .col .sub { margin-bottom: 14px; }
  .mono { font-variant-numeric: tabular-nums; }
  .row-pending td { background: #fafafa; color: #9ca3af; }
  .tag-pending { display: inline-block; margin-left: 6px; font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #e5e7eb; color: #6b7280; vertical-align: middle; }

</style>
</head>
<body>
  <h1>📈 情绪龙头低吸</h1>
  <div class="sub">操作说明：1，有效期：市场增量不足，大票主升浪无法启动时使用；2，核心是最高辨识度情绪龙的低吸</div>
  <div class="sub">左：首次唯一最高板（盘中）　·　中：换手龙断板低吸（盘中）　·　右：连板低吸（盘后）</div>

  <div class="grid2" style="grid-template-columns: 1fr 1fr 1fr;">
    <!-- ============ 左栏：首次唯一最高板 ============ -->
    <div class="col">
      <h1>🚀 首次唯一最高板</h1>
      <div class="sub" id="subHighest">加载中…</div>
      <div class="card">
        <div id="highestAllBody"></div>
      </div>
    </div>


    <!-- ============ 中间栏：换手龙断板低吸 ============ -->
    <div class="col">
      <h1>🐉 换手龙断板低吸</h1>
      <div class="sub" id="subDuanban">加载中…</div>
      <div class="card">
        <div id="duanbanCandBody"></div>
      </div>
      <div class="card">
        <div id="duanbanRecBody"></div>
      </div>
    </div>

    <!-- ============ 最右栏：连板低吸 ============ -->
    <div class="col">
      <h1>📉 连板低吸策略</h1>
      <div class="sub" id="subLianban">加载中…</div>
      <div class="card">
        <div id="lianbanAllBody"></div>
      </div>
    </div>
  </div>

  <script src="highest_data.js" charset="utf-8"></script>
  <script src="lianban_data.js" charset="utf-8"></script>
  <script src="duanban_data.js" charset="utf-8"></script>
  <script>
    var H = window.HIGHEST_DATA || null;
    var LB = window.LIANBAN_DATA || null;
    var DB = window.DUANBAN_DATA || null;
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function emotionClass(e){ if(!e || e==='暂无数据')return ''; if(e.indexOf('退潮')>=0)return 'emotion-recession'; if(e.indexOf('混沌')>=0)return 'emotion-chaos'; return 'emotion-normal'; }

    function parseYMD(v){
      if(!v) return null;
      var s=String(v).replace(/-/g,'');
      if(s.length!==8) return null;
      var d=new Date(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8));
      return (isNaN(d.getTime())) ? null : d;
    }
    function daysBetween(a,b){
      var da=parseYMD(a), db=parseYMD(b);
      if(!da||!db) return '—';
      return Math.round((db-da)/86400000);
    }
    // ===== 首次唯一最高板 =====
    function renderHighestTable(rows){
      if(!rows || rows.length===0) return '<div class="empty-tip">当日暂无信号</div>';
      var h='<table><tr><th>股票代码</th><th>名称</th><th>高度</th><th>触发时间</th><th>换手</th><th>量比</th><th>振幅</th><th>封单(手)</th></tr>';
      rows.forEach(function(r){
        h+='<tr><td class="mono">'+esc(r.code)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.height)+'连板</td>'
          +'<td class="mono">'+esc(r.time)+'</td><td class="mono">'+esc(r.hs)+'%</td><td class="mono">'+esc(r.lb)+'</td>'
          +'<td class="mono">'+esc(r.zf)+'%</td><td class="mono">'+esc(r.fd)+'</td></tr>';
      });
      return h+'</table>';
    }
    function renderSellTable(list){
      if(!list || list.length===0) return '<div class="empty-tip">暂无卖出记录</div>';
      var h='<table><tr><th>代码</th><th>名称</th><th>买入日</th><th>买入价</th><th>操作周期</th><th>卖出日</th><th>卖出时间</th><th>卖出价</th><th>原因</th><th>收益率</th></tr>';
      list.forEach(function(s){
        var pnlCls = (s.pnl==null||s.pnl===0) ? '' : (s.pnl>0 ? 'emotion-up' : 'emotion-down');
        h+='<tr><td class="mono">'+esc(s.code)+'</td><td>'+esc(s.name)+'</td>'
          +'<td class="mono">'+esc(s.buyDate)+'</td><td class="mono">'+esc(s.buyPrice)+'</td>'
          +'<td class="mono">'+esc(s.period)+'天</td>'
          +'<td class="mono">'+esc(s.sellDate)+'</td><td class="mono">'+esc(s.sellTime)+'</td>'
          +'<td class="mono">'+esc(s.sellPrice)+'</td>'
          +'<td>'+esc(s.reason)+'</td><td class="mono '+pnlCls+'">'+esc(s.pnl)+'%</td></tr>';
      });
      return h+'</table>';
    }

    function renderCombinedTable(){
      var rows = [];
      var today = H.today;
      Object.keys(H.days||{}).sort().forEach(function(d){
        (H.days[d]||[]).forEach(function(r){
          rows.push({date:d, rec:r});
        });
      });
      var sellsMap = {};
      Object.keys(H.sells||{}).forEach(function(sd){
        (H.sells[sd]||[]).forEach(function(s){
          sellsMap[s.code+"_"+s.buyDate] = s;
        });
      });
      var posMap = H.positions||{};
      var data = rows.map(function(row){
        var key = row.rec.code+"_"+row.date;
        var sell = sellsMap[key];
        var pos = posMap[key];
        var status, sdate, stime, sprice, reason, pnl, period, buyPrice, cost;
        buyPrice = sell ? sell.buyPrice : (pos ? pos.cost : row.rec.cost);
        if(sell){ status="已卖出"; sdate=sell.sellDate; stime=sell.sellTime; sprice=sell.sellPrice; reason=sell.reason; pnl=sell.pnl; period=sell.period; }
        else if(pos && pos.status==="holding"){ status="持有中"; cost=pos.cost; }
        else { status="—"; }
        return {date:row.date, rec:row.rec, time:row.rec.time, status:status, buyPrice:buyPrice,
                zb:row.rec.zb,
                emotion:H.emotions ? H.emotions[row.date] : '',
                sdate:sdate, stime:stime, sprice:sprice, reason:reason, pnl:pnl, period:period, cost:cost};
      });
      data.sort(function(a,b){ return a.date>b.date?-1:(a.date<b.date?1:0); });  // 最近在上,最早在下
      if(data.length===0) return '<div class="empty-tip">暂无记录</div>';
      var h='<table><tr><th>买入日</th><th>情绪</th><th>选票时间</th><th>代码</th><th>名称</th><th>高度</th><th>买入价</th><th>炸板</th><th>状态</th><th>卖出日</th><th>卖出时间</th><th>卖出价</th><th>原因</th><th>收益率</th><th>周期</th></tr>';
      data.forEach(function(x){
        var pnlCls = (x.pnl==null||x.pnl===0) ? '' : (x.pnl>0 ? 'emotion-up' : 'emotion-down');
        h+='<tr><td class="mono">'+esc(x.date)+'</td><td class="'+emotionClass(x.emotion)+'">'+esc(x.emotion||'—')+'</td><td class="mono">'+(x.time||"—")+'</td><td class="mono">'+esc(x.rec.code)+'</td><td>'+esc(x.rec.name)+'</td>'
          +'<td>'+esc(x.rec.height)+'</td><td class="mono">'+esc(x.buyPrice)+'</td>'
          +'<td>'+(x.zb||"—")+'</td>'
          +'<td>'+esc(x.status)+'</td><td class="mono">'+(x.sdate||"—")+'</td><td class="mono">'+(x.stime||"—")+'</td>'
          +'<td class="mono">'+(x.sprice||"—")+'</td><td>'+(x.reason||"—")+'</td>'
          +'<td class="mono '+pnlCls+'">'+(x.pnl!=null?x.pnl+'%':"—")+'</td><td class="mono">'+(x.period!=null?x.period+'天':"—")+'</td></tr>';
      });
      return h+'</table>';
    }

    function initHighest(){
      if(!H || !H.days){ document.getElementById('subHighest').textContent='未找到数据：请运行 monitor_dash.py 生成 highest_data.js'; return; }
      document.getElementById('subHighest').textContent='数据生成时间：'+H.generated;
      document.getElementById('highestAllBody').innerHTML = renderCombinedTable();
    }
    function initLianban(){
      if(!LB){ document.getElementById('subLianban').textContent='未找到数据：请运行连板股低吸 monitor.py 生成 lianban_data.js'; return; }
      document.getElementById('subLianban').innerHTML='数据生成时间：'+LB.generated+'　截止：'+LB.today+'　操作说明：<br>1，新周期龙头突破高度、盘面普涨、相关消息刺激等情绪氛围好的时候用，做踏空资金对龙头的再次认可和涨停持续预期；<br>2，必须是换手龙不是连续一字板龙，否则筹码有断层成本不一样；<br>3，当日首阴尾盘买入或者次日确认反包买入；<br>4，换手龙前期涨幅大，资金沉淀较多，如果走出上升趋势结构，说明有资金看好后市。';
      var records = (LB.pool||[]).slice();
      if(records.length===0){ document.getElementById('lianbanAllBody').innerHTML='<div class="empty-tip">暂无记录</div>'; return; }
      var active = records.filter(function(r){ return r.status!=='已卖出'; });
      function floatPnl(r){
        var b=r.buyPrice, c=r.lastClose;
        if(b==null||b===0||c==null) return null;
        return (c/b-1)*100;
      }
      function row(r){
        var pending=(r.status==='待确认');
        var pnl=pending?null:floatPnl(r);
        var pc=(pnl==null)?'':(pnl>0?'emotion-up':(pnl<0?'emotion-down':''));
        var pnlTxt=(pnl==null)?'—':pnl.toFixed(2)+'%';
        var name=esc(r.name);
        if(pending){
          name+='<span class="tag-pending" title="断板日收盘低于前一日收盘，需次一交易日收盘超过'+(r.pendingRefClose!=null?r.pendingRefClose:'涨停日收盘价')+'才重新进看板">待确认</span>';
        }
        return '<tr'+(pending?' class="row-pending"':'')+'><td class="mono">'+esc(r.breakDate)+'</td><td class="mono">'+esc(r.code)+'</td><td>'+name+'</td>'
          +'<td>'+esc(r.boards)+'</td><td class="mono">'+esc(r.daysAfterBreak)+'</td>'
          +'<td class="mono">'+esc(r.declineStreak!=null?r.declineStreak+'天':'—')+'</td>'
          +'<td class="mono '+pc+'">'+pnlTxt+'</td></tr>';
      }
      active.sort(function(a,b){ return b.breakDate>a.breakDate?1:-1; });
      var h='<table><tr><th>断板日</th><th>代码</th><th>名称</th><th>断板前板数</th><th>断板后天数</th><th>连跌天数</th><th>收益率</th></tr>';
      active.forEach(function(r){ h+=row(r); });
      document.getElementById('lianbanAllBody').innerHTML = h+'</table>';
    }

    function initDuanban(){
      var sub=document.getElementById('subDuanban');
      if(!DB){ sub.textContent='未找到数据：请运行本策略 monitor.py 生成 duanban_data.js'; return; }
      sub.textContent='数据生成时间：'+(DB.generated||'—')+'　情绪：'+(DB.emotion||'—');
      var cands=(DB.candidates||[]).slice();
      {
        var hc='<div style="font-weight:600;margin-bottom:8px">候选池 <span class="count">'+cands.length+' 只</span> <span style="font-weight:normal;color:#6b7280;font-size:12px">—— 前一日连板≥2板、连板内含非一字板、前期涨幅≥50%</span></div>';
        hc+='<table><tr><th>代码</th><th>名称</th><th>板数</th><th>前期涨幅</th><th>现价</th><th>今日涨幅</th></tr>';
        if(cands.length===0){ hc+='<tr><td colspan="6" class="empty-tip">今日无候选（全部淘汰或已转入观察池）</td></tr>'; }
        cands.forEach(function(r){
          var pc=(r.pct==null)?'':(r.pct>0?'emotion-up':(r.pct<0?'emotion-down':''));
          hc+='<tr><td class="mono">'+esc(r.code)+'</td><td>'+esc(r.name)+'</td>'
            +'<td>'+esc(r.boards)+'板</td><td class="mono">'+(r.runUp!=null?r.runUp+'%':'—')+'</td>'
            +'<td class="mono">'+esc(r.price==null?'—':r.price)+'</td>'
            +'<td class="mono '+pc+'">'+(r.pct!=null?(r.pct>0?'+':'')+r.pct+'%':'—')+'</td></tr>';
        });
        document.getElementById('duanbanCandBody').innerHTML=hc+'</table>';
      }
      function fmtDate(v){ if(!v||v.length!==8) return '—'; return v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8); }
      var recs=(DB.records||[]).slice();
      recs.sort(function(a,b){ return (a.breakDate||'')<(b.breakDate||'')?1:-1; });
      {
        var h2='<div style="font-weight:600;margin-bottom:8px">记录 <span class="count">'+recs.length+' 条</span></div>';
        h2+='<table><tr><th>买入日</th><th>当日情绪</th><th>代码</th><th>名称</th><th>高度</th><th>买入价</th>'
          +'<th>卖出日</th><th>卖出时间</th><th>卖出价</th><th>原因</th><th>收益率</th><th>周期</th></tr>';
        if(recs.length===0){ h2+='<tr><td colspan="12" class="empty-tip">暂无记录</td></tr>'; }
        recs.forEach(function(r){
          var pnl=r.pnl, pc=(pnl==null||pnl===0)?'':(pnl>0?'emotion-up':'emotion-down');
          var em=r.emotion||'—';
          h2+='<tr>'
            +'<td class="mono">'+fmtDate(r.buyDate)+'</td>'
            +'<td class="'+emotionClass(em)+'">'+esc(em)+'</td>'
            +'<td class="mono">'+esc(r.code)+'</td>'
            +'<td>'+esc(r.name)+'</td>'
            +'<td>'+esc(r.boards)+'连板</td>'
            +'<td class="mono">'+(r.buyPrice!=null?r.buyPrice:'—')+'</td>'
            +'<td class="mono">'+fmtDate(r.sellDate)+'</td>'
            +'<td class="mono">'+(r.sellTime||'—')+'</td>'
            +'<td class="mono">'+(r.sellPrice!=null?r.sellPrice:'—')+'</td>'
            +'<td>'+esc(r.sellReason||'—')+'</td>'
            +'<td class="mono '+pc+'">'+(pnl!=null?pnl+'%':'—')+'</td>'
            +'<td class="mono">'+(r.period!=null?r.period+'天':'—')+'</td>'
            +'</tr>';
        });
        document.getElementById('duanbanRecBody').innerHTML=h2+'</table>';
      }
    }

    initHighest();

    initLianban();
    initDuanban();
  </script>
</body>
</html>
