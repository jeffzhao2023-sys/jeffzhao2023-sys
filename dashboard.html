<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投资看板 · 阿尔法低吸 & 首次唯一最高板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", -apple-system, sans-serif; background: #f4f6f9; color: #1f2937; padding: 20px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: normal; }
  .b-today { background: #2563eb; color: #fff; }
  .b-recession { background: #ef4444; color: #fff; }
  .b-ok { background: #16a34a; color: #fff; }
  .b-empty { background: #9ca3af; color: #fff; }
  .b-highest { background: #7c3aed; color: #fff; }
  .b-none { background: #e5e7eb; color: #374151; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
  th { background: #f8fafc; color: #374151; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .emotion-recession { color: #ef4444; font-weight: 600; }
  .emotion-normal { color: #16a34a; }
  .emotion-chaos { color: #d97706; }
  details { margin-bottom: 8px; }
  summary { cursor: pointer; font-size: 14px; font-weight: 600; padding: 8px 10px; background: #f8fafc; border-radius: 8px; }
  summary:hover { background: #eef2f7; }
  .count { color: #6b7280; font-weight: normal; margin-left: 8px; }
  .empty-tip { color: #6b7280; font-style: italic; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .grid2c { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1200px) { .grid2c { grid-template-columns: 1fr; } }
  .col h1 { font-size: 18px; margin-bottom: 4px; }
  .col .sub { margin-bottom: 14px; }
  .mono { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <h1>📈 投资看板</h1>
  <div class="sub">左：阿尔法低吸（尾盘）　·　中：首次唯一最高板（盘中）　·　右：地量地价（盘中）</div>

  <div class="grid2">

    <!-- ============ 左栏：阿尔法低吸 ============ -->
    <div class="col">
      <h1>📊 阿尔法低吸策略</h1>
      <div class="sub" id="sub">加载中…</div>

      <div id="todayCard" class="card" style="display:none">
        <div class="grid2c">
          <div>
            <h2>买入时点 <span class="badge b-today">NEXT OPEN 买入</span></h2>
            <div id="todayBuyBody"></div>
          </div>
          <div>
            <h2>卖出时点 <span class="badge b-recession">卖出</span></h2>
            <div id="todaySellBody"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>历史选股记录</h2>
        <div id="historyBody"></div>
      </div>
    </div>

    <!-- ============ 右栏：首次唯一最高板 ============ -->
    <div class="col">
      <h1>🚀 首次唯一最高板</h1>
      <div class="sub" id="subHighest">加载中…</div>

      <div class="grid2c">
        <div class="card">
          <h2>买入时点 <span class="badge b-highest">实时</span></h2>
          <div id="highestTodayBody"></div>
          <h3 style="margin:12px 0 4px;font-size:13px;color:#374151;">历史信号</h3>
          <div id="highestHistoryBody"></div>
        </div>

        <div class="card">
          <h2>卖出时点 <span class="badge b-recession">持仓离场</span></h2>
          <div id="highestSellBody"></div>
        </div>
      </div>
    </div>

    <!-- ============ 右栏：地量地价 ============ -->
    <div class="col">
      <h1>📉 地量地价策略</h1>
      <div class="sub" id="subDildj">加载中…</div>

      <div class="card">
        <h2>今日疑似买入 <span class="badge b-highest">盘中</span></h2>
        <div id="dildjBuyBody"></div>
      </div>

      <div class="card">
        <h2>今日卖出提醒 <span class="badge b-recession">卖出</span></h2>
        <div id="dildjSellBody"></div>
      </div>
    </div>

  </div>

  <script src="signal_data.js" charset="utf-8"></script>
  <script src="highest_data.js" charset="utf-8"></script>
  <script src="dildj_data.js" charset="utf-8"></script>
  <script>
    var D = window.SIGNAL_DATA || null;
    var H = window.HIGHEST_DATA || null;
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function emotionClass(e){ if(e.indexOf('退潮')>=0)return 'emotion-recession'; if(e.indexOf('混沌')>=0)return 'emotion-chaos'; return 'emotion-normal'; }

    function renderTable(rows){
      if(!rows || rows.length===0) return '<div class="empty-tip">无票</div>';
      var h='<table><tr><th>股票代码</th><th>确认日期</th><th>收盘价</th><th>情绪</th></tr>';
      rows.forEach(function(r){ h+='<tr><td>'+esc(r.code)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.close)+'</td><td class="'+emotionClass(r.emotion)+'">'+esc(r.emotion)+'</td></tr>'; });
      return h+'</table>';
    }
    function renderSell(rows){
      if(!rows || rows.length===0) return '<div class="empty-tip">当日无卖出提醒</div>';
      var h='<table><tr><th>股票代码</th><th>买入日期</th><th>买入价</th><th>卖出原因</th><th>最新收盘</th></tr>';
      rows.forEach(function(r){ h+='<tr><td>'+esc(r.code)+'</td><td>'+esc(r.buyDate)+'</td><td>'+esc(r.buyPrice)+'</td><td>'+esc(r.reason)+'</td><td>'+esc(r.lastClose)+'</td></tr>'; });
      return h+'</table>';
    }

    // ===== 阿尔法低吸 =====
    function initLow(){
      if(!D || !D.days){ document.getElementById('sub').textContent='未找到数据：请先运行 run.bat 生成 signal_data.js'; return; }
      document.getElementById('sub').textContent='数据生成时间：'+D.generated;
      var today = D.today;
      var tc = document.getElementById('todayCard');
      var td = null;
      for(var i=0;i<D.days.length;i++){ if(D.days[i].date===today){ td=D.days[i]; break; } }
      if(td){
        tc.style.display='';
        var allRec = td.candidates.length>0 && td.candidates.every(function(c){ return c.emotion.indexOf('退潮')>=0; });
        var badge = allRec ? '<span class="badge b-recession">退潮期不买</span>' : '<span class="badge b-ok">可买</span>';
        tc.querySelector('h2').innerHTML = '今日买入候选 <span class="badge b-today">'+esc(today)+'</span> '+badge;
        document.getElementById('todayBuyBody').innerHTML = renderTable(td.candidates);
        document.getElementById('todaySellBody').innerHTML = renderSell(td.sells);
      } else {
        tc.style.display='';
        tc.querySelector('h2').innerHTML = '今日买入候选 <span class="badge b-today">'+esc(today)+'</span> <span class="badge b-empty">今日尚未运行</span>';
        document.getElementById('todayBuyBody').innerHTML = '<div class="empty-tip">请先在尾盘运行 run.bat</div>';
        document.getElementById('todaySellBody').innerHTML = '<div class="empty-tip">今日尚未运行</div>';
      }
      var hb = document.getElementById('historyBody');
      if(D.days.length===0){ hb.innerHTML='<div class="empty-tip">暂无历史记录</div>'; return; }
      var h='';
      D.days.forEach(function(day){
        var allRec = day.candidates.length>0 && day.candidates.every(function(c){return c.emotion.indexOf('退潮')>=0;});
        var tag = allRec ? ' <span class="emotion-recession">(退潮不买)</span>' : '';
        var cnt = (day.candidates.length===0 && (!day.sells||day.sells.length===0)) ? '无票' : (day.candidates.length + ' 买 / ' + day.sells.length + ' 卖');
        var inner = renderTable(day.candidates);
        if(day.sells && day.sells.length>0){ inner += '<h3 style="margin:10px 0 4px;font-size:13px;color:#374151;">卖出提醒</h3>' + renderSell(day.sells); }
        h+='<details'+(day.date===today?' open':'')+'><summary>'+esc(day.date)+'<span class="count">'+cnt+tag+'</span></summary>'+inner+'</details>';
      });
      hb.innerHTML = h;
    }

    // ===== 首次唯一最高板 =====
    function renderHighestTable(rows){
      if(!rows || rows.length===0) return '<div class="empty-tip">当日暂无信号</div>';
      var h='<table><tr><th>股票代码</th><th>名称</th><th>高度</th><th>触发时间</th><th>换手</th><th>量比</th><th>振幅</th><th>封单(手)</th></tr>';
      rows.forEach(function(r){
        h+='<tr><td class="mono">'+esc(r.code)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.height)+'连板</td>'
          +'<td class="mono">'+esc(r.time)+'</td><td class="mono">'+esc(r.hs)+'%</td><td class="mono">'+esc(r.lb)+'</td>'
          +'<td class="mono">'+esc(r.zf)+'%</td><td class="mono">'+esc(r.fd)+'</td></tr>';
      });
      return h+'</table>';
    }
    function renderSellTable(list){
      if(!list || list.length===0) return '<div class="empty-tip">暂无卖出记录</div>';
      var h='<table><tr><th>代码</th><th>名称</th><th>买入日</th><th>买入价</th><th>卖出日</th><th>卖出价</th><th>原因</th><th>收益率</th></tr>';
      list.forEach(function(s){
        h+='<tr><td class="mono">'+esc(s.code)+'</td><td>'+esc(s.name)+'</td>'
          +'<td class="mono">'+esc(s.buyDate)+'</td><td class="mono">'+esc(s.buyPrice)+'</td>'
          +'<td class="mono">'+esc(s.sellDate)+'</td><td class="mono">'+esc(s.sellPrice)+'</td>'
          +'<td>'+esc(s.reason)+'</td><td class="mono">'+esc(s.pnl)+'%</td></tr>';
      });
      return h+'</table>';
    }
    function initHighest(){
      if(!H || !H.days){ document.getElementById('subHighest').textContent='未找到数据：请运行 monitor_dash.py 生成 highest_data.js'; return; }
      document.getElementById('subHighest').textContent='数据生成时间：'+H.generated;
      var today = H.today;
      var tb = document.getElementById('highestTodayBody');
      var todayRows = H.days[today] || [];
      var badge = (todayRows && todayRows.length>0) ? '<span class="badge b-highest">'+todayRows.length+' 个信号</span>'
                                                     : '<span class="badge b-none">暂无信号</span>';
      tb.innerHTML = '<div style="margin-bottom:8px">今日('+esc(today)+') ' + badge + '</div>' + renderHighestTable(todayRows);
      var hb = document.getElementById('highestHistoryBody');
      var keys = Object.keys(H.days).sort().reverse();
      if(keys.length===0){ hb.innerHTML='<div class="empty-tip">暂无历史记录</div>'; return; }
      var h='';
      keys.forEach(function(k){
        var rows = H.days[k];
        var cnt = (rows && rows.length>0) ? rows.length+' 个信号' : '无';
        var inner = renderHighestTable(rows);
        h+='<details'+(k===today?' open':'')+'><summary>'+esc(k)+'<span class="count">'+cnt+'</span></summary>'+inner+'</details>';
      });
      hb.innerHTML = h;
      var sb = document.getElementById('highestSellBody');
      var sellKeys = Object.keys(H.sells||{}).sort().reverse();
      if(sellKeys.length===0){ sb.innerHTML='<div class="empty-tip">暂无卖出记录</div>'; }
      else {
        var sh='';
        sellKeys.forEach(function(k){
          var list = H.sells[k];
          sh+='<details open><summary>'+esc(k)+'<span class="count">'+list.length+' 笔卖出</span></summary>'+renderSellTable(list)+'</details>';
        });
        sb.innerHTML = sh;
      }
    }

    // ===== 地量地价 =====
    var DD = window.DILDJ_DATA || null;
    function initDildj(){
      if(!DD){ document.getElementById('subDildj').textContent='未找到数据：请运行地量地价 monitor.py 生成 dildj_data.js'; return; }
      document.getElementById('subDildj').textContent='数据生成时间：'+DD.generated;
      var buys = DD.buys || [];
      var sells = DD.sells || [];
      var bhtml='';
      if(buys.length===0){ bhtml='<div class="empty-tip">暂无疑似买入</div>'; }
      else {
        bhtml='<table><tr><th>股票代码</th><th>名称</th><th>现价</th><th>涨幅</th><th>5日线</th><th>状态</th></tr>';
        buys.forEach(function(r){ bhtml+='<tr><td class="mono">'+esc(r.code)+'</td><td>'+esc(r.name)+'</td><td class="mono">'+esc(r.price)+'</td><td class="mono">'+esc(r.pct)+'%</td><td class="mono">'+esc(r.ma5)+'</td><td>'+esc(r.status)+'</td></tr>'; });
        bhtml+='</table>';
      }
      document.getElementById('dildjBuyBody').innerHTML = bhtml;
      var shtml = (sells.length===0) ? '<div class="empty-tip">当日无卖出提醒</div>' : '';
      if(sells.length>0){
        shtml='<table><tr><th>股票代码</th><th>卖出原因</th><th>时间</th></tr>';
        sells.forEach(function(s){ shtml+='<tr><td class="mono">'+esc(s.code)+'</td><td>'+esc(s.reason)+'</td><td class="mono">'+esc(s.time)+'</td></tr>'; });
        shtml+='</table>';
      }
      document.getElementById('dildjSellBody').innerHTML = shtml;
    }
    initLow();
    initHighest();
    initDildj();
  </script>
</body>
</html>
